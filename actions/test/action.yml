name: Node yarn test
description: "Run yarn test on the project after dependencies have been installed."

inputs:
  working_directory:
    description: "Directory to run yarn test in (default: repository root)"
    required: false
    type: string
    default: "."

  post_install_script:
    description: "Optional script to run after yarn install"
    required: false
    type: string
    default: ""

outputs:
  yarn_test_exit_code:
    description: "The exit code from the yarn test command"
    value: ${{ steps.yarn_test.outputs.exit_code }}

runs:
  using: "composite"

  steps:
    - name: Run Post-Install Script
      if: ${{ inputs.post_install_script != '' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        POST_INSTALL_SCRIPT: ${{ inputs.post_install_script }}
      run: |
        echo "Running post-install script..."
        eval "${POST_INSTALL_SCRIPT}"

    - name: Run yarn test
      id: yarn_test
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        set +e
        yarn run test
        EXIT_CODE=$?
        set -e
        
        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
